<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar TIC · licitacions, notícies i alertes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radar TIC">

<style>
:root{
 --bg:#FFFFFF; --surface:#FFFFFF; --ink:#17171A; --muted:#6E6C66; --faint:#A3A198;
 --line:#EDEBE4; --line2:#DCD9CF; --accent:#1B3A6B;
 --teal:#0E7A5C; --teal-bg:#EAF6F1; --amber:#9A5B00; --amber-bg:#FBF3E2;
 --red:#B23030; --red-bg:#FBEDED; --blue:#185FA5; --purple:#534AB7;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 72px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 0 10px}
.tt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tt h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.tt h1 span{color:var(--muted);font-weight:400}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.rfr{appearance:none;border:0;background:none;color:var(--blue);font-size:16px;cursor:pointer;padding:2px 4px;line-height:1}
.rfr:active{transform:rotate(180deg)}
.dot.on{background:#1D9E75}.dot.off{background:#BA7517}
.controls{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:10px}
.seg{display:inline-flex;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--faint);font:inherit;font-size:13px;padding:6px 8px;cursor:pointer;border-bottom:2px solid transparent}
.seg button.act{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:5px 0}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.search{flex:1;min-width:160px}
.search input{width:100%;font:inherit;font-size:13px;padding:7px 2px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;color:var(--ink)}
.search input:focus{outline:none;border-bottom-color:var(--accent)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin:16px 2px 10px}
.list{display:flex;flex-direction:column}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:18px 0 20px;position:relative}
.card:first-child{border-top:0}
.card.rail{padding-left:14px}
.card.rail::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;border-radius:2px}
.rail-amber::before{background:var(--amber)} .rail-red::before{background:var(--red)}
.c-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.c-meta{min-width:0}
.organ{display:block;font-size:13.5px;font-weight:700;color:var(--accent);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
.exp{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:2px;display:inline-block}
.avui{font-size:10px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:1px;letter-spacing:.06em}
.card.fresh{background:linear-gradient(90deg,var(--amber-bg),transparent 55%)}
.objecte{font-size:15px;font-weight:500;margin:8px 0 2px;line-height:1.45}
.pill{flex:none;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill-open{color:var(--teal)} .pill-warn{color:var(--amber)} .pill-urgent{color:var(--red)} .pill-closed{color:var(--faint);font-weight:500}
.pill-adj{color:var(--blue)} .pill-aval{color:var(--amber)}
.badges{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.b{color:var(--muted)}
.b-amber{color:var(--amber);font-weight:700}
.b-gray{color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}}
.m{background:none;border-radius:0;padding:0}
.m .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.m .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.m .v.neg{color:var(--teal)}
.m .sub{font-size:11px;color:var(--faint);margin-top:1px}
.crit{margin-top:14px}
.crit .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.bar span{display:block}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12.5px}
.leg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:0}
.bid{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.bid .h{font-size:12px;color:var(--muted);margin-bottom:6px}
.bid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.bid li{font-size:13px;display:flex;align-items:center;gap:7px}
.bid .win{color:var(--teal);font-weight:500}
.bid .nif{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.hint{font-size:12.5px;color:var(--muted);margin-top:11px}
.hint a{color:var(--blue);text-decoration:none}.hint a:hover{text-decoration:underline}
details.look{margin-top:12px}
details.look>summary{cursor:pointer;font-size:12.5px;color:var(--blue);list-style:none}
details.look>summary::-webkit-details-marker{display:none}
details.look>summary::before{content:"▸ ";color:var(--faint)}
details.look[open]>summary::before{content:"▾ "}
.look-body{font-size:12.5px;color:var(--muted);margin-top:8px}
.look-body table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.look-body td{padding:3px 0;border-bottom:1px solid var(--line)}
.look-body .pct{color:var(--teal);text-align:right;white-space:nowrap}
.c-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;color:var(--blue);padding:2px 0}
.lnk:hover{text-decoration:underline}
.faint{color:var(--faint);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border-top:1px solid var(--line)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}

.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:7px}
.tabs button.act{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted)}
.tabs button.act .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.news{display:flex;flex-direction:column}
.ncard{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 18px}
.ncard:first-child{border-top:0}
.ncard.fresh{background:linear-gradient(90deg,var(--amber-bg),transparent 55%)}
.nmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.nsrc{color:var(--accent);font-weight:700}
.ntitle{font-size:15px;font-weight:600;line-height:1.4;margin:6px 0 4px}
.ntitle a{text-decoration:none;color:var(--ink)}
.ntitle a:hover{text-decoration:underline}
.nsum{font-size:13px;color:var(--muted);line-height:1.5}
.nchips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:11.5px;border:1px solid var(--line2);border-radius:99px;padding:2px 10px;color:var(--muted);background:none;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip b{font-weight:600;color:var(--teal)}
.acard{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 18px 14px;position:relative}
.acard.fresh{background:linear-gradient(90deg,var(--amber-bg),transparent 55%)}
.acard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--amber)}
.acard.red::before{background:var(--red)}
.acard.teal::before{background:var(--teal)}
.ahead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.awhen{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.awhen b{color:var(--ink);font-size:13px}
.abar{height:5px;border-radius:99px;background:var(--bg);margin-top:10px;overflow:hidden}
.abar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--amber),var(--teal))}
.asec{font-size:13px;font-weight:600;color:var(--muted);margin:20px 2px 10px;text-transform:uppercase;letter-spacing:.05em}
.asec:first-child{margin-top:4px}
.aempty{font-size:13px;color:var(--faint);padding:8px 2px}
.spin{text-align:center;color:var(--muted);padding:40px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="tt">
    <h1>Radar de licitacions <span>· CTTI, Generalitat i món local</span></h1>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusTxt">carregant…</span><button class="rfr" id="refreshBtn" title="Actualitza ara">↻</button></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="radar" class="act">Radar</button>
    <button data-view="news">Notícies <span class="n" id="nNews">·</span></button>
    <button data-view="alerts">Alertes <span class="n" id="nAlerts">·</span></button>
  </nav>
  <div class="controls" id="radarControls">
    <div class="seg" id="block">
      <button data-v="gen" class="act">CTTI · Generalitat</button>
      <button data-v="local">Món local</button>
    </div>
    <div class="seg" id="scope">
      <button data-v="gen" class="act">Generalitat</button>
      <button data-v="ctti">Només CTTI</button>
    </div>
    <div class="seg" id="localsub" style="display:none">
      <button data-v="all" class="act">Tot</button>
      <button data-v="bit">BIT</button>
      <button data-v="dip">Diputacions</button>
      <button data-v="aj">Ajuntaments</button>
    </div>
    <div class="seg" id="phase">
      <button data-v="lic" class="act">En licitació</button>
      <button data-v="aval">En avaluació</button>
      <button data-v="adj">Adjudicades</button>
    </div>
    <div class="seg" id="sortsel">
      <button data-v="termini" class="act">Per termini</button>
      <button data-v="import">Per import</button>
    </div>
    <label class="chk"><input type="checkbox" id="cpv" checked> Filtre TIC</label>
    <label class="chk"><input type="checkbox" id="sda"> Només SDA</label>
    <div class="search"><input id="q" placeholder="Cerca objecte, òrgan o expedient…"></div>
  </div>
</header>
<section id="view-radar">
<div class="count" id="count"></div>
<div class="list" id="list"><div class="spin">Connectant amb dades obertes…</div></div>
</section>
<section id="view-news" hidden>
<div class="count" id="newsCount"></div>
<div class="news" id="newsList"><div class="spin">Carregant notícies…</div></div>
</section>
<section id="view-alerts" hidden>
<div id="alertsBody"><div class="spin">Carregant alertes…</div></div>
</section>
</div>

function whereFor(ph){
 const sc=whereScope();
 if(ph==="lic"){const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10)+"T00:00:00";return sc+" AND fase_publicacio='Anunci de licitació' AND termini_presentacio_ofertes > '"+since+"'";}
 if(ph==="aval")return sc+" AND fase_publicacio='Expedient en avaluació'";
 return sc+" AND fase_publicacio='Adjudicació'";
}
function whereSpec(){return whereScope()+" AND fase_publicacio='Anunci de licitació' AND racionalitzacio_contractacio like '%Específic%'";}
function orderFor(ph){return ph==="lic"?"termini_presentacio_ofertes ASC":(ph==="adj"?"data_publicacio_adjudicacio DESC":"termini_presentacio_ofertes DESC");}

async function sodaFetch(where,order,limit){
 const u=new URL(SODA);
 u.searchParams.set("$select",SELECT);u.searchParams.set("$where",where);
 if(order)u.searchParams.set("$order",order);u.searchParams.set("$limit",String(limit));
 let lastErr;
 for(let i=0;i<3;i++){
  const c=new AbortController();const to=setTimeout(()=>c.abort(),22000);
  try{
   const res=await fetch(u.toString(),{signal:c.signal,headers:{"Accept":"application/json"}});
   clearTimeout(to);
   if(!res.ok){lastErr=new Error("HTTP "+res.status);if(res.status>=400&&res.status<500)throw lastErr;await new Promise(r=>setTimeout(r,800*(i+1)));continue;}
   const data=await res.json();
   if(!Array.isArray(data)){lastErr=new Error("resposta no-array");await new Promise(r=>setTimeout(r,900));continue;}
   return data;
  }catch(e){clearTimeout(to);lastErr=e;await new Promise(r=>setTimeout(r,700*(i+1)));}
 }
 throw lastErr;
}
async function load(){
 setStatus("load");
 let rows=null, ok=false;
 try{
  const lim=state.block==="local"?3000:900;
  if(state.phase==="lic"){
   const g=await sodaFetch(whereFor("lic"),orderFor("lic"),lim);
   let sp=[]; try{ sp=await sodaFetch(whereSpec(),"termini_presentacio_ofertes DESC",200); }catch(e){}
   rows=g.concat(sp);
  } else {
   rows=await sodaFetch(whereFor(state.phase),orderFor(state.phase),state.block==="local"?1500:300);
  }
  ok=true;
 }catch(e){ ok=false; }
 const snap=(state.block==="local")
   ?(state.phase==="adj"?(SNAPSHOT.adjLocal||[]):(state.phase==="lic"?(SNAPSHOT.openLocal||[]):[]))
   :(state.phase==="adj"?(SNAPSHOT.adjudicated||[]):(state.phase==="lic"?(SNAPSHOT.open||[]):[]));
 if(ok && rows && rows.length){ state.rows=dedup(rows.map(normalize)); state.live=true; }
 else { state.rows=snap; state.live=false; }   // buit o fallit -> instantania diaria (mostra)
 render();
}
function visible(){
 let rows=state.rows.slice();
 if(state.block==="gen"&&state.scope==="ctti"&&state.live===false)rows=rows.filter(r=>(r.organ||"").indexOf("Telecomunicacions")>=0||String(r.exp||"").indexOf("CTTI")===0);
 if(state.block==="local"&&state.live===false){const O=r=>(r.organ||"").toUpperCase();
  if(state.localsub==="aj")rows=rows.filter(r=>O(r).indexOf("AJUNTAMENT")>=0);
  else if(state.localsub==="dip")rows=rows.filter(r=>O(r).indexOf("DIPUTACI")>=0);
  else if(state.localsub==="bit")rows=rows.filter(r=>O(r).indexOf("INSTITUT MUNICIPAL")>=0&&O(r).indexOf("BARCELONA")>=0&&(O(r).indexOf("INNOVACI")>=0||O(r).indexOf("INFORM")>=0));}
 if(state.cpv)rows=rows.filter(r=>cpvMatch(r.cpv)||r.sda==="child");
 if(state.sda)rows=rows.filter(r=>r.sda);
 if(state.q){const q=state.q.toLowerCase();rows=rows.filter(r=>((r.exp||"")+" "+(r.organ||"")+" "+(r.objecte||"")).toLowerCase().indexOf(q)>=0);}
 if(state.sort==="import"){
  const val=r=>(state.phase==="adj"?(r.importAdj!=null?r.importAdj:r.base):(r.base!=null?r.base:r.vec))||0;
  rows.sort((a,b)=>val(b)-val(a));
 }else{
  rows.sort((a,b)=>(a.termini||"9999").localeCompare(b.termini||"9999"));
  if(state.phase==="adj")rows.reverse();
  if(state.phase==="lic")rows.sort((a,b)=>(a.sda==="child"?0:1)-(b.sda==="child"?0:1));
 }
 return rows;
}
function setStatus(kind){
 const dot=document.getElementById("dot"),tx=document.getElementById("statusTxt");
 if(kind==="load"){dot.className="dot";tx.textContent="carregant…";return;}
 if(state.live){dot.className="dot on";tx.textContent="en viu · "+new Date().toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"});}
 else{dot.className="dot off";tx.textContent="mostra (sense connexió en viu)";}
}
function metric(k,v,sub,neg){return '<div class="m"><div class="k">'+esc(k)+'</div><div class="v'+(neg?' neg':'')+'">'+v+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';}
function metricTermini(d,iso){
 if(d==null)return metric("Termini d'ofertes","—");
 if(d<=0)return metric("Termini d'ofertes","tancat","el "+dmy(iso));
 return metric("Termini d'ofertes",d+" dies",dmy(iso));
}
function critBlock(e){
 if(!e.criteris)return "";
 const tot=e.criteris.reduce((a,c)=>a+c.p,0);
 const bar=e.criteris.map(c=>'<span style="width:'+(c.p/tot*100)+'%;background:'+c.c+'"></span>').join("");
 const leg=e.criteris.map(c=>'<span><i style="background:'+c.c+'"></i>'+esc(c.l)+' <b style="font-weight:500">'+c.p+'</b></span>').join("");
 return '<div class="crit"><div class="lab"><span>Criteris d\'adjudicació</span><span>'+tot+' punts</span></div><div class="bar">'+bar+'</div><div class="leg">'+leg+'</div></div>';
}
function bidBlock(r,e,isAdj){
 if(e.licitadors){
  const li=e.licitadors.map(b=>'<li class="'+(b.g?'win':'')+'">'+(b.g?'✓ ':'')+esc(b.nom)+'<span class="nif">'+esc(b.nif||"")+'</span></li>').join("");
  return '<div class="bid"><div class="h">Es van presentar ('+e.licitadors.length+')</div><ul>'+li+'</ul></div>';
 }
 if(isAdj){
  let h='';
  if(r.adj)h+='<div class="bid"><div class="h">Adjudicatari</div><ul><li class="win">✓ '+esc(r.adj)+'</li></ul>';
  else h+='<div class="bid">';
  h+='<div class="hint">'+(r.ofertes!=null?('Ofertes rebudes: '+r.ofertes+'. '):'')+'Llista de licitadors: <a href="'+esc(r.url||'#')+'" target="_blank" rel="noopener">obre la publicació</a></div></div>';
  return h;
 }
 return "";
}
function lookBlock(r){
 return '<details class="look" data-organ="'+esc(r.organCode||"")+'" data-cpv="'+esc((r.cpv[0]||"").slice(0,2))+'"><summary>Incumbent / rondes anteriors (mateix òrgan + CPV)</summary><div class="look-body">…</div></details>';
}
async function loadLook(det){
 const body=det.querySelector(".look-body");
 if(det.dataset.done)return;det.dataset.done="1";
 const organ=det.dataset.organ,div=det.dataset.cpv;
 if(!state.live||!organ){body.innerHTML='Disponible només en mode en viu (obre el fitxer al navegador).';return;}
 body.innerHTML='cercant…';
 try{
  const rows=await sodaFetch("codi_organ='"+organ+"' AND fase_publicacio='Adjudicació' AND upper(codi_cpv) like '%"+div+"%'","data_publicacio_adjudicacio DESC",8);
  const seen={};const out=[];
  for(const raw of rows){const r=normalize(raw);if(seen[r.exp])continue;seen[r.exp]=1;
   if(r.base&&r.importAdj){const d=(r.base-r.importAdj)/r.base*100;out.push('<tr><td>'+esc(r.adj||"—")+'</td><td class="pct">−'+d.toFixed(1)+'%</td></tr>');}
   if(out.length>=5)break;}
  body.innerHTML=out.length?('<table>'+out.join("")+'</table>'):'Sense adjudicacions prèvies comparables.';
 }catch(e){body.innerHTML='No s\'ha pogut consultar.';}
}
function statusPill(r){
 if(state.phase==="adj")return '<span class="pill pill-adj">Adjudicada</span>';
 if(state.phase==="aval")return '<span class="pill pill-aval">En avaluació</span>';
 const d=daysLeft(r.termini);
 if(d!=null&&d<=0)return '<span class="pill pill-closed">Tancat</span>';
 if(d==null)return '<span class="pill pill-open">Oberta</span>';
 const cls=d<=7?"pill-urgent":(d<=15?"pill-warn":"pill-open");
 return '<span class="pill '+cls+'">'+d+' dies</span>';
}
function card(r){
 const e=ENRICH[r.exp]||{};const isAdj=state.phase==="adj",isOpen=state.phase==="lic";
 const d=daysLeft(r.termini);
 const fresh=(r.dpub===TODAY);
 const disc=(r.base&&r.importAdj)?((r.base-r.importAdj)/r.base*100):null;
 const rail=(r.sda==="child"?"rail rail-amber":(isOpen&&d!=null&&d>0&&d<=7?"rail rail-red":""))+(fresh?" fresh":"");
 let bdg='';
 if(r.sda==="child")bdg+='<span class="b b-amber">Específic SDA</span>';
 if(r.sda==="parent")bdg+='<span class="b b-gray">Marc SDA · permanent</span>';
 if(r.cpv[0])bdg+='<span class="b b-gray">CPV '+esc(r.cpv[0])+(r.cpv.length>1?' +'+(r.cpv.length-1):'')+'</span>';
 if(r.proc)bdg+='<span class="b b-gray">'+esc(r.proc)+'</span>';
 else if(r.sda==="child")bdg+='<span class="b b-gray">Derivat d\'SDA</span>';
 let m3=isAdj?metric("Descompte",disc!=null?('−'+disc.toFixed(1)+'%'):'—',r.ofertes!=null?(r.ofertes+' ofertes'):'',true):metricTermini(d,r.termini);
 let m2=isAdj?metric("Import adjudicació",eur(r.importAdj)):metric("Valor estimat (VEC)",eur(r.vec));
 return '<article class="card '+rail+'">'
  +'<div class="c-head"><div class="c-meta"><span class="organ">'+esc(r.organ||"")+'</span><span class="exp">'+esc(r.exp||"—")+'</span>'+(fresh?'<span class="avui">AVUI</span>':'')+'</div>'+statusPill(r)+'</div>'
  +'<div class="objecte">'+esc(short(r.objecte))+'</div>'
  +'<div class="badges">'+bdg+'</div>'
  +'<div class="metrics">'+metric("Pressupost base",eur(r.base))+m2+m3+'</div>'
  +critBlock(e)
  +bidBlock(r,e,isAdj)
  +(isOpen?lookBlock(r):'')
  +'<div class="c-foot">'+(r.url?'<a class="lnk" href="'+esc(r.url)+'" target="_blank" rel="noopener">↗ Publicació oficial</a>':'<span class="faint">sense enllaç</span>')
  +(!e.criteris&&(isOpen||state.phase==="aval")?'<span class="hint">Criteris: <a href="'+esc(r.url||"#")+'" target="_blank" rel="noopener">al plec de la publicació</a></span>':'')+'</div>'
  +'</article>';
}
function render(){
 setStatus();
 const rows=visible();
 const cnt=document.getElementById("count");
 const ph={lic:"en licitació",aval:"en avaluació",adj:"adjudicades"}[state.phase];
 let scopeLbl=state.block==="local"?({all:"Món local",bit:"BIT",dip:"Diputacions",aj:"Ajuntaments"}[state.localsub]):(state.scope==="ctti"?"CTTI":"Generalitat");
 cnt.textContent=rows.length+" licitacions "+ph+(state.cpv?" · filtre TIC actiu":"")+" · "+scopeLbl;
 const list=document.getElementById("list");
 if(!rows.length){
  let msg=state.live===false&&state.phase==="aval"
   ?"<b>Sense dades en mode mostra</b>Aquesta vista necessita connexió en viu. Obre el fitxer al navegador (doble clic) o publica\u2019l perquè es connecti a dades obertes."
   :"<b>Cap resultat</b>Prova de treure el filtre TIC, canviar de fase o ampliar a tota la Generalitat.";
  list.innerHTML='<div class="empty">'+msg+'</div>';return;
 }
 list.innerHTML=rows.map(card).join("");
 list.querySelectorAll("details.look").forEach(det=>det.addEventListener("toggle",()=>{if(det.open)loadLook(det);}));
}
function seg(id,key){document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 [...e.currentTarget.children].forEach(x=>x.classList.remove("act"));b.classList.add("act");state[key]=b.dataset.v;
 if(key==="sort"){render();return;}
 if(key==="block"){document.getElementById("scope").style.display=state.block==="local"?"none":"";document.getElementById("localsub").style.display=state.block==="local"?"":"none";}
 load();});}
seg("block","block");seg("scope","scope");seg("localsub","localsub");seg("phase","phase");
document.getElementById("cpv").addEventListener("change",e=>{state.cpv=e.target.checked;render();});
document.getElementById("sda").addEventListener("change",e=>{state.sda=e.target.checked;render();});
let qt;document.getElementById("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;render();},180);});
load();

/* ---------------- PESTANYES + NOTÍCIES + ALERTES ---------------- */
let NEWS=null, ALERTS=null, curView="radar";
function relTime(iso){
 try{const d=new Date(iso);const h=(Date.now()-d)/36e5;
  if(h<1)return "ara mateix"; if(h<24)return "fa "+Math.round(h)+" h";
  const dd=Math.round(h/24); if(dd===1)return "ahir"; if(dd<30)return "fa "+dd+" dies";
  return dmy(iso);}catch(e){return "";}
}
function showView(v){
 curView=v;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("act",b.dataset.view===v));
 document.getElementById("view-radar").hidden=v!=="radar";
 document.getElementById("view-news").hidden=v!=="news";
 document.getElementById("view-alerts").hidden=v!=="alerts";
 document.getElementById("radarControls").style.display=v==="radar"?"":"none";
 if(v==="news"){NEWS?renderNews():loadNews();}
 if(v==="alerts"){ALERTS?renderAlerts():loadAlerts();}
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showView(b.dataset.view);});
async function fetchJson(name){
 const r=await fetch(name+"?v="+new Date().toISOString().slice(0,10),{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 return r.json();
}
function goRadarSearch(q){
 showView("radar");
 const inp=document.getElementById("q"); inp.value=q; state.q=q; render();
 window.scrollTo({top:0,behavior:"smooth"});
}
async function loadNews(){
 const el=document.getElementById("newsList");
 try{
  NEWS=await fetchJson("noticies.json");
  renderNews(); return;
 }catch(e){
  el.innerHTML='<div class="empty"><b>Not\u00edcies no disponibles</b>El robot encara no ha publicat noticies.json, o est\u00e0s obrint el fitxer en local.</div>';
 }
}
function renderNews(){
 const el=document.getElementById("newsList");
 {
  const its=NEWS.items||[];
  document.getElementById("nNews").textContent=its.length||"·";
  document.getElementById("newsCount").textContent=its.length+" notícies · darrers 21 dies · font: premsa, BOE i DOGC";
  if(!its.length){el.innerHTML='<div class="empty"><b>Res de nou</b>El robot diari les portarà quan n\u2019hi hagi.</div>';return;}
  el.innerHTML=its.map(it=>{
   const chips=(it.tags||[]).map(t=>{
     const n=(it.radar||{})[t];
     return '<span class="chip" data-q="'+esc(t==="Normativa"?"":t)+'">'+esc(t)+(n?' <b>'+n+' al radar</b>':'')+'</span>';
   }).join("");
   const fresh=(it.date||"").slice(0,10)===TODAY;
   return '<article class="ncard'+(fresh?' fresh':'')+'">'
    +'<div class="nmeta"><span class="nsrc">'+esc(it.src)+'</span><span>·</span><span>'+esc(relTime(it.date))+'</span>'+(fresh?'<span class="avui">AVUI</span>':'')+'</div>'
    +'<div class="ntitle"><a href="'+esc(it.link)+'" target="_blank" rel="noopener">'+esc(it.t)+'</a></div>'
    +(it.sum?'<div class="nsum">'+esc(it.sum)+'</div>':'')
    +(chips?'<div class="nchips">'+chips+'</div>':'')
    +'</article>';
  }).join("");
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{const q=c.dataset.q;if(q)goRadarSearch(q);}));
 }
}
function __oldNewsCatch(){ try{ }catch(e){
  el.innerHTML='<div class="empty"><b>Notícies no disponibles</b>Encara no s\u2019ha publicat el primer noticies.json (el robot diari el genera), o est\u00e0s obrint el fitxer en local.</div>';
 }
}
function eurC(n){return n==null?"":new Intl.NumberFormat("ca-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Math.round(n));}
async function loadAlerts(){
 const el=document.getElementById("alertsBody");
 try{
  ALERTS=await fetchJson("alertes.json");
  renderAlerts(); return;
 }catch(e){
  el.innerHTML='<div class="empty"><b>Alertes no disponibles</b>El robot encara no ha publicat alertes.json, o est\u00e0s obrint el fitxer en local.</div>';
 }
}
function renderAlerts(){
 const el=document.getElementById("alertsBody");
 {
  const fut=ALERTS.futures||[], ven=ALERTS.venciments||[];
  document.getElementById("nAlerts").textContent=(fut.length+ven.length)||"·";
  let html="";
  html+='<div class="asec">🔭 A punt de sortir (anuncis previs i consultes)</div>';
  html+=fut.length?fut.map(f=>'<article class="acard teal'+(((f.dpub||"")===TODAY)?' fresh':'')+'">'
    +'<div class="ahead"><div><span class="exp">'+esc(f.exp||"—")+'</span><span class="organ">'+esc(f.organ)+'</span></div>'
    +'<span class="awhen">'+esc(f.fase)+(f.dpub?' · '+esc(dmy(f.dpub)):'')+'</span></div>'
    +'<div class="objecte" style="font-size:14px">'+esc((f.objecte||"").slice(0,150))+'</div>'
    +'<div class="badges"><span class="b b-gray">'+esc(f.bloc)+'</span></div>'
    +(f.url?'<div class="c-foot" style="margin-top:10px"><a class="lnk" href="'+esc(f.url)+'" target="_blank" rel="noopener">↗ Publicació</a></div>':'')
    +'</article>').join(""):'<div class="aempty">Cap anunci previ TIC actiu ara mateix.</div>';
  html+='<div class="asec">⚠️ Contractes que s\u2019acaben (properes licitacions probables)</div>';
  html+=ven.length?ven.map(v=>{
    const pct=Math.max(4,Math.min(100,Math.round(100*(1-v.dies/270))));
    const cls=v.dies<=60?"red":(v.dies<=150?"":"teal");
    return '<article class="acard '+cls+'">'
    +'<div class="ahead"><div><span class="exp">'+esc(v.exp)+'</span><span class="organ">'+esc(v.organ)+'</span></div>'
    +'<span class="awhen">fi <b>'+esc(dmy(v.fi))+'</b> · '+v.dies+' d</span></div>'
    +'<div class="objecte" style="font-size:14px">'+esc((v.objecte||"").slice(0,140))+'</div>'
    +'<div class="badges">'
    +(v.incumbent?'<span class="b b-amber">Incumbent: '+esc(v.incumbent.slice(0,38))+'</span>':'')
    +(v.import?'<span class="b b-gray">'+eurC(v.import)+'</span>':'')
    +'<span class="b b-gray">'+esc(v.bloc)+'</span></div>'
    +'<div class="abar"><i style="width:'+pct+'%"></i></div>'
    +(v.url?'<div class="c-foot" style="margin-top:10px"><a class="lnk" href="'+esc(v.url)+'" target="_blank" rel="noopener">↗ Publicació</a></div>':'')
    +'</article>';}).join(""):'<div class="aempty">Cap contracte TIC amb venciment en 9 mesos.</div>';
  el.innerHTML=html;
 }
}
function __oldAlertsCatch(){ try{ }catch(e){
  el.innerHTML='<div class="empty"><b>Alertes no disponibles</b>Encara no s\u2019ha publicat el primer alertes.json (el robot diari el genera), o est\u00e0s obrint el fitxer en local.</div>';
 }
}

async function loadSideData(){
 try{const n=await fetchJson("noticies.json");NEWS=n;document.getElementById("nNews").textContent=(n.items||[]).length||"·";if(curView==="news")renderNews();}catch(e){}
 try{const a=await fetchJson("alertes.json");ALERTS=a;document.getElementById("nAlerts").textContent=((a.futures||[]).length+(a.venciments||[]).length)||"·";if(curView==="alerts")renderAlerts();}catch(e){}
}
loadSideData();

document.getElementById("refreshBtn").addEventListener("click",refreshAll);
setInterval(refreshAll, 3600*1000);
seg("sortsel","sort");
if(location.hash==="#news")showView("news");
if(location.hash==="#alerts")showView("alerts");
